<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
<meta http-equiv="Content-Language" content="es">
<meta name="Robots" content="index">
<meta name="Author" content="Juan Jose">
<meta name="Distribution" content="global">
      
      <title>Calendario</title>

<!-- Enlace para Css -->
<link rel="stylesheet"href="styles.css">

<!-- Enlace para fuentes de google -->
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;700&displayfamily=Amatic+SC:wght@700&family=Caveat:wght@700&family=Dancing+Script:wght@700&family=Lobster&family=Metal+Mania&family=Yellowtail& family=Permanent+Marker&family=Piedra&family=Sriracha&display=swap" rel="stylesheet">

</head>

<body>
<div class="app-container">

  <!-- Primera línea: Icono y reloj -->
  <header class="cabecera">
    <img src="img/Juanjo.ico" class="ico" width="28">
    <div class="reloj">
      <p class="tiempo"></p>
    </div>
  </header>

  <!-- Contenedor para el calendario y la lista de eventos -->
  <main>
    <section id="calendario"></section>
    <div id="event-list"></div>
  </main>

  <!-- MODIFICADO: El formulario ahora está FUERA de <main> para que el botón de añadir funcione -->
  <section id="appointment-form" class="hidden"> 
    <h1 id="form-title">"Agregar evento"</h1>
    <p id="selected-date"></p> 
    <label for="ingresar-evento">Evento:</label>
    <input type="text" id="ingresar-evento">
    <br><br>
    <label for="boton-hora">Hora:</label>
    <input type="time" id="boton-hora">
    <br><br>
    <button id="boton-atras-form">Atrás</button>
    <button id="boton-guardar-form">Guardar</button>
  </section> 

  <!-- Notificaciones y botón flotante fuera de los contenedores principales -->
  <div id="notificaciones"></div> 
  <button id="boton-flotante" class="flotante">+</button>

</div> <!-- Fin de app-container -->

<script src="script.js"></script>

</body>
</html>
